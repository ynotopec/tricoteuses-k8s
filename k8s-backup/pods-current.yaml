    - args:
      - |
        python3 -c '
        import hashlib, os, json, pathlib
        pathlib.Path("/hermes-home/.hermes/webui").mkdir(parents=True, exist_ok=True)
        if not pathlib.Path("/hermes-home/.hermes/webui/settings.json").exists():
            password = os.environ["HERMES_WEBUI_PASSWORD"].encode()
            salt = os.urandom(16)
            hash_val = hashlib.pbkdf2_hmac("sha256", password, salt, 60000)
            settings = {
                "password_hash": hash_val.hex(),
                "password_salt": salt.hex()
            }
            pathlib.Path("/hermes-home/.hermes/webui/settings.json").write_text(json.dumps(settings))
            print("Password seeded for fresh instance")
        else:
            print("settings.json already exists, skipping password seed")
        '
      command:
      - sh
      - -c
      env:
      - name: HERMES_WEBUI_PASSWORD
        value: CHANGE_ME
