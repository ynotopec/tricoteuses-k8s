  spec:
    containers:
    - command:
      - sh
      - -c
      - |-
        cat > /etc/nginx/conf.d/default.conf << 'NGINXEOF'
        map $request_uri $fallback_file {
            ~^/model-eff /model-eff.html;
            default /index.html;
        }

        server {
            listen 80 default_server;
            server_name localhost;

            root /usr/share/nginx/html;
            index index.html;

            # Serve /model-eff.html directly
            location = /model-eff/ {
                try_files /model-eff.html =404;
            }

            location = /model-eff {
                return 301 /model-eff/;
            }

            location / {
                try_files $uri $uri/ $fallback_file;
            }

            error_page 500 502 503 504 /50x.html;
            location = /50x.html {
                root /usr/share/nginx/html;
            }
        }
        NGINXEOF
        nginx -g 'daemon off;'
