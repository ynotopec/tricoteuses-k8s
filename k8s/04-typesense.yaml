apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: typesense
  namespace: tricoteuses
  labels:
    app: typesense
    app.kubernetes.io/name: typesense
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: tricoteuses
spec:
  serviceName: typesense
  replicas: 1
  selector:
    matchLabels:
      app: typesense
  template:
    metadata:
      labels:
        app: typesense
        app.kubernetes.io/name: typesense
        app.kubernetes.io/component: search
    spec:
      containers:
      - name: typesense
        image: typesense/typesense:29.0
        ports:
        - containerPort: 8108
          name: http
        args:
        - "--data-dir=/data"
        - "--api-key=$(TYPESENSE_API_KEY)"
        - "--enable-cors"
        envFrom:
        - secretRef:
            name: tricoteuses-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8108
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
      restartPolicy: Always
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: microk8s-hostpath
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: typesense
  namespace: tricoteuses
  labels:
    app: typesense
spec:
  ports:
  - port: 8108
    targetPort: 8108
    name: http
  selector:
    app: typesense
  type: ClusterIP
