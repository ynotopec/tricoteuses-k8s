apiVersion: apps/v1
kind: Deployment
metadata:
  name: tricoteuses-typesense
  namespace: demo1
  labels:
    app: tricoteuses-typesense
    app.kubernetes.io/name: tricoteuses-typesense
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: tricoteuses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tricoteuses-typesense
  template:
    metadata:
      labels:
        app: tricoteuses-typesense
        app.kubernetes.io/name: tricoteuses-typesense
        app.kubernetes.io/component: search
    spec:
      containers:
      - name: typesense
        image: typesense/typesense:0.25.0
        ports:
        - containerPort: 8108
          name: http
        args:
        - "--data-dir=/data"
        - "--api-key=$(TYPESENSE_API_KEY)"
        - "--enable-cors"
        envFrom:
        - secretRef:
            name: tricoteuses-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8108
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tricoteuses-typesense
  namespace: demo1
  labels:
    app: tricoteuses-typesense
spec:
  ports:
  - port: 8108
    targetPort: 8108
    name: http
  selector:
    app: tricoteuses-typesense
  type: ClusterIP
