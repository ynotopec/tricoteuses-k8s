apiVersion: apps/v1
kind: Deployment
metadata:
  name: exploratrice
  namespace: demo1
  labels:
    app: exploratrice
    app.kubernetes.io/name: exploratrice
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tricoteuses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exploratrice
  template:
    metadata:
      labels:
        app: exploratrice
        app.kubernetes.io/name: exploratrice
        app.kubernetes.io/component: web
    spec:
      containers:
      - name: exploratrice
        image: registry.demo1.ailab.infocepo.com/tricoteuses/exploratrice:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: production
        - name: CANUTES_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tricoteuses-secrets
              key: POSTGRES_PASSWORD
        - name: OIDC_ISSUER
          value: "https://auth.code4code.eu/realms/tricoteuses"
        - name: OIDC_AUTHORIZATION_ENDPOINT
          value: "https://auth.code4code.eu/realms/tricoteuses/protocol/openid-connect/auth"
        - name: OIDC_TOKEN_ENDPOINT
          value: "https://auth.code4code.eu/realms/tricoteuses/protocol/openid-connect/token"
        - name: OIDC_USERINFO_ENDPOINT
          value: "https://auth.code4code.eu/realms/tricoteuses/protocol/openid-connect/userinfo"
        - name: OIDC_CLIENT_ID
          value: exploratrice
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: tricoteuses-secrets
              key: OIDC_CLIENT_SECRET
        - name: OIDC_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: tricoteuses-secrets
              key: OIDC_SESSION_SECRET
        - name: OIDC_REDIRECT_URI
          value: "https://exploratrice.demo1.ailab.infocepo.com/callback"
        - name: OIDC_POST_LOGOUT_REDIRECT_URI
          value: "https://exploratrice.demo1.ailab.infocepo.com/"
        - name: SERVER_URL
          value: "https://exploratrice.demo1.ailab.infocepo.com"
        envFrom:
        - configMapRef:
            name: tricoteuses-db-config
        - secretRef:
            name: tricoteuses-secrets
        ports:
        - containerPort: 3000
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: exploratrice
  namespace: demo1
  labels:
    app: exploratrice
spec:
  ports:
  - port: 80
    targetPort: 3000
    name: http
  selector:
    app: exploratrice
  type: ClusterIP
