apiVersion: apps/v1
kind: Deployment
metadata:
  name: exploratrice
  namespace: demo1
  labels:
    app: exploratrice
    app.kubernetes.io/name: exploratrice
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tricoteuses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exploratrice
  template:
    metadata:
      labels:
        app: exploratrice
        app.kubernetes.io/name: exploratrice
        app.kubernetes.io/component: web
    spec:
      containers:
      - name: exploratrice
        image: tricoteuses/exploratrice:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: production
        envFrom:
        - configMapRef:
            name: tricoteuses-config
        - secretRef:
            name: tricoteuses-secrets
        ports:
        - containerPort: 3000
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: exploratrice
  namespace: demo1
  labels:
    app: exploratrice
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: exploratrice
  type: ClusterIP
